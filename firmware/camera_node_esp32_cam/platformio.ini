[env]
platform = espressif32
board = esp32cam
framework = arduino

upload_port = COM4
upload_speed = 460800

monitor_port = COM4
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

lib_deps =
    links2004/WebSockets@^2.7.3

[env:camera_dev]
build_flags =
  -D APP_ENV_DEV=1
  -D ENABLE_SERIAL_CLI=1
  -D ENABLE_CONFIG_PORTAL=1
  -D ENABLE_WIFI_SCAN_LOG=1
  -D ENABLE_FRAME_LOG=1

[env:camera_prod]
build_flags =
  -D APP_ENV_PROD=1
  -D ENABLE_SERIAL_CLI=0
  -D ENABLE_CONFIG_PORTAL=1
  -D ENABLE_WIFI_SCAN_LOG=0
  -D ENABLE_FRAME_LOG=0