; PlatformIO Project Configuration File
; Joystick Bridge ESP8266 - MVP Smart Car IoT

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_port = COM4
monitor_port = COM4
board_build.filesystem = littlefs
lib_deps =
  bblanchon/ArduinoJson @ ^7.4.3
  links2004/WebSockets @ ^2.6.1
  ESP8266WiFi
  ESP8266WebServer
  ESP8266HTTPClient
  LittleFS